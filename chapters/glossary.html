  <header class="chapter-hero">

    <h1>용어집 &amp; 종합 퀴즈</h1>
    <p class="lead">이 책에 나온 핵심 용어를 한곳에 모았다. 모르는 말이 나오면 검색해 보고, 설명 아래의 링크로 해당 장으로 돌아가 시뮬레이터를 다시 만져 보자. 마지막에는 모든 장을 아우르는 종합 퀴즈로 실력을 점검할 수 있다.</p>

    <h2>용어집</h2>

      <div class="row"><div class="seg" id="gl-part"><button data-value="all" class="on">전체</button></div><span class="gl-count" id="gl-count"></span></div>

    <div id="gl-list"></div>

  <section id="final" data-nonum>
    <h2>종합 퀴즈</h2>

  </section>

    const term = q.value.trim(), p = part();

  render();

    ["intro", "장치 n대를 교환기 없이 모두 직접 이으려면 필요한 링크 수는?", ["n", "2n", "n(n−1)/2", "n²"], 2, "각 쌍마다 한 가닥이므로 n(n−1)/2. 교환기(스타)를 두면 n개면 된다."],
    ["intro", "회선을 100 Mbps에서 1 Gbps로 올렸을 때 가장 덜 개선되는 것은?", ["대용량 파일 다운로드", "여러 4K 영상 동시 시청", "해외 서버와의 핑(RTT)", "클라우드 백업 시간"], 2, "대역폭(도로 폭)은 늘어도 거리와 빛의 속도가 정하는 지연(도로 길이)은 그대로다."],
    ["intro", "광섬유 속 빛의 속도로 계산할 때, 1 ms 동안 신호가 가는 거리는 대략?", ["2 km", "20 km", "200 km", "2,000 km"], 2, "광섬유 속 빛은 약 20만 km/s이므로 1 ms에 약 200 km를 간다."],
    ["signal", "섀넌 용량 C = B·log₂(1+SNR)에서 SNR이 30 dB인 채널의 대역폭을 두 배로 늘리면 용량은?", ["약 10% 증가", "두 배", "네 배", "변하지 않는다"], 1, "용량은 대역폭에 정비례한다. 반면 전력을 두 배(+3 dB)로 하면 SNR이 높을 때 약 10%만 는다."],
    ["signal", "디지털 전송이 여러 중계 구간을 거쳐도 품질이 유지되는 이유는?", ["디지털 신호에는 잡음이 섞이지 않아서", "중계기가 0/1을 판정해 깨끗한 신호를 다시 만들어서(재생 중계)", "디지털 신호의 전압이 더 높아서", "중계기가 잡음만 골라 증폭하지 않아서"], 1, "판정이 맞는 한 잡음이 구간마다 리셋된다. 아날로그 증폭은 잡음도 함께 키워 누적된다."],

    ["layers", "라우터가 패킷을 다음 구간으로 넘길 때 일반적으로 바뀌지 않는 것은?", ["이더넷 목적지 MAC 주소", "IP 헤더의 TTL", "목적지 IP 주소", "IP 헤더 체크섬"], 2, "목적지 IP 주소는 끝에서 끝까지 그대로다(NAT 제외). MAC 주소는 구간마다 바뀌고, TTL이 줄어들므로 체크섬도 다시 계산된다."],
    ["layers", "TCP/IPv4로 1바이트를 이더넷에 보낼 때 효율이 매우 낮은 주된 이유는?", ["TCP가 1바이트를 여러 번 재전송해서", "TCP·IP·이더넷 헤더와 최소 프레임 크기 패딩이 데이터보다 훨씬 커서", "IP가 1바이트를 조각으로 나눠서", "이더넷이 1바이트를 압축할 수 없어서"], 1, "헤더 40바이트 + 패딩 + 이더넷 18바이트 + 프리앰블·IFG 20바이트로 선로 위 84바이트 중 1바이트만 데이터다(약 1.2%)."],

    ["copper", "VDSL2 같은 빠른 DSL이 전화국에서 먼 집에서는 효과가 적은 이유는?", ["전화 통화와 충돌해서", "높은 주파수일수록 거리에 따라 감쇠가 커져 고주파 대역을 못 쓰게 되어서", "전화선이 디지털 신호를 못 보내서", "모뎀의 처리 속도가 부족해서"], 1, "감쇠는 거리와 주파수에 따라 커진다. 먼 거리에서는 VDSL2가 추가로 쓰는 높은 주파수가 잡음에 묻혀 ADSL2+와 비슷한 속도만 난다."],
    ["copper", "1000BASE-T가 Cat5e로 1 Gbps를 내는 방법은?", ["2쌍으로 500 Mbps씩 단방향", "4쌍 모두 양방향 동시에 쌍당 250 Mbps, 에코 제거 사용", "한 쌍에 1 GHz 신호", "맨체스터 부호를 10배 빠르게"], 1, "4쌍 × 125 Mbaud × 2비트(PAM-5) = 1 Gbps를 양방향 동시에 보내며, 자기 송신 신호(에코)와 옆 쌍 누화를 DSP로 지운다."],
    ["optical", "표준 단일 모드 광섬유에서 손실이 가장 작아 장거리 WDM의 주무대가 되는 파장대는?", ["850 nm 부근", "1310 nm 부근", "1550 nm 부근(C 밴드)", "1383 nm 부근"], 2, "레일리 산란(1/λ⁴)과 적외선 흡수 사이의 골짜기인 1550 nm 부근이 약 0.2 dB/km로 가장 투명하고, EDFA도 이 대역을 증폭한다. 1383 nm는 옛 광섬유의 물 흡수 봉우리다."],

    ["optical", "FTTH의 PON에서 OLT와 각 가정 사이에 놓이는 광 분배기의 특징은?", ["전원이 필요한 능동 증폭기다", "전원 없이 빛을 나누는 수동 소자라 1:32 분배 시 약 15~17 dB 손실이 생긴다", "가정마다 다른 파장을 골라 보낸다", "상향 신호를 저장했다가 차례로 보낸다"], 1, "분배기는 유리로 된 수동 소자다. 빛을 N개로 나누므로 이상적으로도 10·log₁₀(N) dB가 줄어든다."],
    ["ethernet", "스위치가 목적지 MAC 주소를 MAC 주소 테이블에서 찾지 못했을 때 하는 일은?", ["프레임을 버린다", "들어온 포트를 뺀 모든 포트로 플러딩한다", "라우터에게 넘긴다", "보낸 장치에게 되돌려 보낸다"], 1, "모르는 목적지는 플러딩한다. 목적지가 답장을 보내면 그 출발지 MAC을 배워 다음부터는 한 포트로만 보낸다."],
    ["ethernet", "802.1Q VLAN 태그에서 VLAN 번호(VID)에 쓰이는 비트 수와 실제로 쓸 수 있는 VLAN 수는?", ["8비트, 254개", "12비트, 4094개", "16비트, 65534개", "24비트, 약 1677만 개"], 1, "VID는 12비트라 4096개인데 0과 4095가 예약되어 4094개다. 24비트(약 1600만)는 VXLAN의 VNI다."],
    ["ethernet", "스위치 사이에 고리(루프)가 있을 때 STP가 없으면 생기는 문제는?", ["프레임의 TTL이 0이 되어 곧 사라진다", "브로드캐스트 프레임이 끝없이 돌며 복제되는 브로드캐스트 폭풍", "MAC 주소가 IP 주소로 바뀐다", "링크 속도가 절반으로 고정된다"], 1, "이더넷 프레임에는 TTL이 없어 고리를 영원히 돌고, 갈림길마다 사본이 늘어 링크가 포화된다."],
    ["ip", "10.1.2.200/25가 속한 서브넷의 브로드캐스트 주소는?", ["10.1.2.127", "10.1.2.255", "10.1.2.128", "10.1.255.255"], 1, "/25의 마지막 바이트 마스크는 128. 200 AND 128 = 128이므로 네트워크는 10.1.2.128, 호스트 비트 7개를 모두 1로 하면 10.1.2.255다."],
    ["ip", "집 공유기의 NAT 때문에 생기는 현상으로 옳은 것은?", ["모든 기기가 서로 다른 공인 IP를 갖는다", "바깥에서 먼저 시작한 연결은 포트 포워딩 없이는 집 안 기기에 닿지 않는다", "사설 주소가 인터넷에서 그대로 라우팅된다", "MAC 주소가 공인 주소로 바뀐다"], 1, "NAT 변환표는 안에서 밖으로 나간 연결에 대해서만 생기므로, 바깥에서 먼저 온 패킷은 받을 기기를 알 수 없어 버려진다."],
    ["ip", "IPv6 주소에서 ::를 한 주소 안에 한 번만 쓸 수 있는 이유는?", ["::가 IPv4 주소를 뜻하므로", "두 번 쓰면 각각 몇 개의 0 묶음을 줄였는지 알 수 없어서", "라우터가 ::를 처리하지 못해서", "주소가 128비트를 넘어가서"], 1, "전체가 8묶음이라는 것만 알기 때문에, 생략된 0 묶음의 위치가 한 곳일 때만 개수를 복원할 수 있다."],
    ["routing", "라우팅 테이블에 10.0.0.0/8, 10.20.0.0/16, 0.0.0.0/0이 있을 때 목적지 10.20.5.1은 어느 경로를 쓸까?", ["0.0.0.0/0", "10.0.0.0/8", "10.20.0.0/16", "세 경로로 나눠 보낸다"], 2, "세 경로 모두 일치하지만 가장 긴 프리픽스 /16을 고른다(최장 접두사 일치)."],
    ["routing", "링크 상태 라우팅(OSPF)의 특징으로 옳은 것은?", ["이웃에게만 목적지별 거리를 알린다", "모든 라우터가 같은 망 지도를 갖고 각자 다익스트라로 계산한다", "AS 경로 전체를 실어 보낸다", "16을 무한대로 쓴다"], 1, "링크 정보를 전체에 퍼뜨려 모두 같은 지도를 갖고 각자 최단 경로 트리를 계산한다. 나머지는 거리 벡터(RIP)나 BGP의 특징이다."],
    ["routing", "같은 IP 프리픽스를 여러 지역에서 동시에 BGP로 광고해 사용자를 가장 가까운 서버로 보내는 방식은?", ["멀티캐스트", "브로드캐스트", "애니캐스트", "NAT"], 2, "애니캐스트는 DNS 루트 서버, 공용 DNS, CDN이 널리 쓴다."],
    ["tcp", "TCP에서 seq=1001로 300바이트를 보냈고 모두 도착했다. 받는 쪽이 보낼 ACK 번호는?", ["1001", "1300", "1301", "1004"], 2, "1001~1300번 바이트를 받았으므로 다음에 기다리는 번호 1301이 ACK 번호다. TCP 번호는 바이트 단위다."],
    ["tcp", "RTT 100 ms, 윈도우 64 KB로 고정된 TCP 연결의 최대 처리율에 가장 가까운 것은?", ["약 640 kbps", "약 64 Mbps", "회선 속도와 같다", "약 5 Mbps"], 3, "처리율 ≤ 윈도우/RTT = 64 KB × 8 / 0.1 s ≈ 5.2 Mbps. 회선을 넓혀도 윈도우가 병목이면 그대로다."],
    ["tcp", "QUIC이 TCP + TLS보다 연결 준비가 빠른 가장 큰 이유는?", ["UDP는 빛보다 빠르게 전달되기 때문", "전송 핸드셰이크와 TLS 1.3 핸드셰이크를 하나로 합쳐 1 RTT(재방문 시 0 RTT)에 끝내기 때문", "암호화를 하지 않기 때문", "라우터가 QUIC 패킷을 먼저 처리하기 때문"], 1, "TCP는 연결 1 RTT 뒤에야 TLS를 시작하지만, QUIC은 둘을 한 번에 처리한다."],
    ["apps", "재귀 리졸버가 처음 보는 이름을 조회할 때 질의하는 순서는?", ["권한 서버 → TLD 서버 → 루트 서버", "루트 서버 → TLD 서버 → 권한 서버", "TLD 서버 → 권한 서버 → 루트 서버", "루트 서버 한 곳에서 모든 답을 받는다"], 1, "각 층은 아래 층의 서버를 알려 주는 위임만 하고, 실제 주소는 마지막 권한 서버가 답한다. 답은 TTL 동안 캐시된다."],
    ["apps", "적응형 비트레이트(ABR) 스트리밍에서 대역폭이 갑자기 떨어지면 플레이어가 하는 일은?", ["연결을 끊고 처음부터 다시 받는다", "UDP로 바꿔 재전송을 끈다", "화질을 그대로 두고 대역폭이 돌아오기를 기다린다", "다음 세그먼트부터 낮은 화질을 골라 버퍼가 바닥나지 않게 한다"], 3, "영상을 2~6초 조각과 여러 화질로 준비해 두므로 조각마다 화질을 바꿔 재버퍼링을 피한다."],
    ["apps", "HTTP/3가 HTTP/2와 가장 크게 다른 점은?", ["QUIC(UDP) 위에서 동작해 연결 준비가 빠르고 손실이 다른 스트림을 멈추지 않는다", "텍스트 대신 이진 프레임을 쓴다", "쿠키를 쓰지 않는다", "한 연결에 요청을 하나만 보낸다"], 0, "이진 프레임과 다중화는 HTTP/2부터 있었다. HTTP/3는 그것을 QUIC 위로 옮겨 TCP의 헤드 오브 라인 블로킹과 핸드셰이크 지연을 줄였다."],
    ["radio", "2.4 GHz 전파의 파장은 대략 얼마인가?", ["1.25 m", "12.5 cm", "1.25 cm", "2.4 mm"], 1, "λ = 3×10⁸ / 2.4×10⁹ ≈ 0.125 m = 12.5 cm. 반파장 다이폴은 약 6 cm다."],
    ["radio", "자유 공간에서 송신기와의 거리가 2배가 되면 수신 전력은?", ["변하지 않는다", "3 dB 줄어든다", "6 dB 줄어든다", "절반인 50%만큼 dBm 값이 줄어든다"], 2, "전력이 거리 제곱에 반비례하므로 2배 거리에서 1/4, 즉 −6 dB다."],
    ["radio", "다중 경로 페이딩을 줄이기 위해 안테나를 여러 개 두는 기법은?", ["다이버시티", "회절", "도플러 보정", "주파수 경매"], 0, "반파장 정도 떨어진 안테나는 서로 독립적으로 출렁이므로 동시에 깊은 골에 빠질 확률이 낮다. 이것이 공간 다이버시티다."],
    ["modulation", "1024QAM은 심볼 하나에 몇 비트를 싣는가?", ["8비트", "10비트", "12비트", "1024비트"], 1, "1024 = 2¹⁰이므로 10비트다. 대신 점 간격이 좁아 SNR이 약 35 dB 이상 필요하다."],
    ["modulation", "OFDM에서 사이클릭 프리픽스를 쓰는 주된 이유는?", ["암호화", "다중 경로 지연으로 인한 심볼 간 간섭 방지", "부반송파 수 증가", "송신 전력 절약"], 1, "심볼 끝을 복사해 앞에 붙인 완충 구간이 메아리를 흡수해 다음 심볼과 섞이지 않게 한다."],
    ["modulation", "무선 처리율을 결정하는 세 요소로 옳은 것은?", ["거리 × 출력 × 안테나 크기", "대역폭 × 스펙트럼 효율 × 공간 스트림 수", "주파수 × 파장 × 속도", "부호율 × 지연 × 손실률"], 1, "더 넓은 대역폭, 심볼당 더 많은 비트(높은 QAM·부호율), 더 많은 MIMO 스트림이 속도를 올리는 세 방향이다."],
    ["wifi", "2.4 GHz Wi-Fi에서 서로 겹치지 않는 채널 조합으로 흔히 권하는 것은?", ["1·2·3", "1·6·11", "3·7·12", "모든 채널이 겹치지 않는다"], 1, "채널 간격은 5 MHz지만 신호 폭은 약 20 MHz라 인접 채널이 겹친다. 1·6·11번은 서로 겹치지 않는다."],
    ["wifi", "Wi-Fi 링크 속도가 2.4 Gbps로 표시되는데 실제 다운로드가 1.5 Gbps 정도인 이유로 가장 거리가 먼 것은?", ["프리앰블·대기·ACK 같은 오버헤드", "보내기와 받기를 동시에 못 하는 반이중", "같은 채널을 쓰는 다른 기기와의 공유", "빛의 속도보다 전파가 느려서"], 3, "전파는 빛의 속도로 간다. 실효 처리율을 깎는 것은 오버헤드, 반이중, 공유 매체(충돌 포함)다."],
    ["wifi", "UWB가 스마트폰 분실물 태그나 차 디지털 키에 쓰이는 핵심 이유는?", ["수 km를 저전력으로 가서", "ns 단위의 짧은 펄스로 비행 시간을 재 cm 단위 거리를 알 수 있어서", "배터리 없이 동작해서", "가장 빠른 데이터 속도를 내서"], 1, "빛은 1 ns에 30 cm를 간다. UWB는 500 MHz 폭의 짧은 펄스로 도착 시각을 정밀하게 재 거리를 계산한다."],
    ["cellular", "이동통신이 지역을 작은 셀로 나누는 가장 큰 이유는?", ["기지국을 싸게 만들려고", "같은 주파수를 떨어진 셀에서 다시 써서 수용량을 늘리려고", "전파를 더 멀리 보내려고", "휴대폰 배터리를 늘리려고"], 1, "주파수는 한정되어 있다. 셀을 나눠 재사용하고, 셀을 더 작게 쪼개면 같은 주파수로 더 많은 사람을 받을 수 있다."],
    ["cellular", "5G 밀리미터파(28 GHz)가 3.5 GHz보다 불리한 점은?", ["속도가 느리다", "대역폭이 좁다", "멀리 가지 못하고 벽·몸에 쉽게 막힌다", "휴대폰에 안테나를 달 수 없다"], 2, "넓은 대역폭 덕분에 빠르지만 경로 손실과 차폐가 커서 셀 반경이 수백 m 수준으로 작다."],
    ["cellular", "핸드오버에서 히스테리시스(여유값)를 두는 이유는?", ["통화 품질을 낮추려고", "두 기지국 경계에서 연결이 계속 왔다 갔다 하는 핑퐁을 막으려고", "요금을 계산하려고", "암호화를 하려고"], 1, "이웃 신호가 '충분히' 더 셀 때만 넘기면 경계에서의 잦은 전환을 막는다. 너무 크면 넘기는 시점이 늦어 끊길 수 있다."],
    ["satellite", "정지 궤도(GEO) 위성 인터넷의 왕복 지연이 저궤도(LEO)보다 훨씬 긴 근본적인 이유는?", ["위성의 처리 장치가 느려서", "위성까지의 거리가 멀어 빛이 오가는 데 시간이 걸려서(최소 약 0.48초)", "GEO 위성은 대역폭이 작아서", "GEO 위성은 레이저 링크를 쓰지 않아서"], 1, "GEO는 고도 35,786 km라 요청과 응답이 오르내리는 거리가 약 14만 km에 이른다. 빛의 속도가 정한 물리적 하한이다."],
    ["satellite", "먼 대륙 사이에서 위성 레이저 경로가 해저 광케이블보다 빠를 수 있는 이유는?", ["위성이 패킷을 압축하기 때문에", "레이저가 광섬유보다 대역폭이 커서", "진공 속 빛이 유리 속 빛보다 약 1.5배 빠르고 경로가 곧기 때문에", "위성 경로는 지상국을 거치지 않아 거리가 0이기 때문에"], 2, "광섬유 속 빛은 굴절률 때문에 초속 약 20만 km로 느려진다. 진공의 레이저는 초속 약 30만 km다."],
    ["satellite", "GPS 수신기가 3차원 위치를 구하려면 위성이 최소 몇 기 필요한가?", ["2기", "3기", "4기", "6기"], 2, "x, y, z 위치와 수신기 시계 오차까지 미지수가 4개이므로 위성 4기가 필요하다."],
    ["serdes", "레인당 100G 이더넷이 NRZ 대신 PAM4를 쓰는 주된 이유는?", ["PAM4는 잡음에 더 강해서", "같은 비트 레이트에서 보 레이트(나이퀴스트 주파수)를 절반으로 낮춰 채널 손실을 줄일 수 있어서", "PAM4는 클럭선이 필요 없어서", "PAM4는 FEC가 필요 없어서"], 1, "PAM4는 기호당 2비트라 보 레이트가 절반이다. 눈 높이 1/3(약 9.5 dB)의 손해보다 고주파 손실이 줄어드는 이득이 크다."],
    ["serdes", "50 Ω 선로 끝에 50 Ω 종단 저항을 달았을 때의 반사 계수는?", ["+1", "−1", "0", "0.5"], 2, "Γ = (R − Z₀)/(R + Z₀) = 0. 정합되면 신호가 모두 흡수되어 반사가 없다."],
    ["serdes", "SerDes 수신부에서 이미 판정한 이전 비트의 꼬리(ISI)를 빼 주는 등화기는?", ["CTLE", "송신 FFE", "DFE", "PLL"], 2, "DFE(판정 궤환 등화기)는 판정 결과로 포스트커서 ISI를 계산해 빼므로 잡음을 증폭하지 않는다."],
    ["netchips", "스위치 칩 용량을 구하는 식으로 옳은 것은?", ["CPU 코어 수 × 클럭", "SerDes 레인 수 × 레인 속도", "버퍼 크기 × 포트 수", "TCAM 줄 수 × 32비트"], 1, "예를 들어 512 × 100G = 51.2 Tbps다. 세대마다 주로 레인 속도가 두 배가 되며 용량이 늘었다."],
    ["netchips", "TCAM에서 최장 접두사 일치가 올바르게 동작하려면?", ["줄을 접두사 길이가 긴 순서로 위에 넣어 둔다", "줄을 IP 주소 크기순으로 넣는다", "기본 경로를 맨 위에 넣는다", "아무 순서로 넣어도 TCAM이 알아서 고른다"], 0, "우선순위 인코더는 일치한 줄 중 가장 위를 고를 뿐이다. 긴 접두사를 위에 두어야 첫 일치가 최장 일치가 된다."],
